<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D1 — Canción principal</title>
<link rel="stylesheet" href="../estilos.css">
<style>
  .wrap { max-width: 420px; margin: 0 auto; background: var(--tarjeta); border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.2); border: 1px solid var(--borde); }
  .phone-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--borde); }
  .app-bar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--borde); }
  .app-bar .title { font-family: Georgia, serif; font-size: 18px; color: var(--subrayado); }
  .app-bar .icons { display: flex; gap: 12px; color: var(--muted); font-size: 16px; }
  .screen { padding: 16px; }
  .song-area { background: var(--fondo); border-radius: 12px; padding: 16px; margin-bottom: 10px; min-height: 180px; }
  .lyrics .ln { display: flex; flex-wrap: wrap; margin-bottom: 6px; }
  .lyrics .p { display: inline-flex; flex-direction: column; margin-right: 2px; }
  .lyrics .c { font-size: 10px; font-weight: 700; color: var(--acorde); height: 14px; }
  .lyrics .t { font-size: 16px; color: var(--texto); }
  .chorus { border-left: 2px solid var(--subrayado); padding: 4px 8px; margin: 2px 0; background: rgba(18,41,63,.04); border-radius: 0 6px 6px 0; }
  .chorus .t { font-weight: 600; }
  .song-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); margin: 8px 0; flex-wrap: wrap; }
  .song-meta .title { font-family: Georgia, serif; font-size: 14px; color: var(--subrayado); font-weight: 600; }
  .transpose { display: flex; align-items: center; gap: 4px; margin: 6px 0; padding: 6px 8px; background: var(--fondo); border-radius: 10px; border: 1px solid var(--borde); }
  .tp-btn { width: 28px; height: 28px; border-radius: 6px; background: var(--tarjeta); border: 1px solid var(--borde); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--texto); }
  .tp-key { flex: 1; text-align: center; }
  .tp-key .k { font-family: Georgia, serif; font-size: 14px; color: var(--subrayado); }
  .tp-key .u { font-size: 8px; color: var(--muted); }
  .tools { display: flex; gap: 4px; margin: 6px 0; flex-wrap: wrap; }
  .tool { height: 26px; padding: 0 8px; border-radius: 6px; background: var(--fondo); border: 1px solid var(--borde); display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--muted); }
  .tool.on { background: var(--subrayado); color: #FBEFDF; border-color: var(--subrayado); }
  .voice { font-size: 10px; color: var(--muted); margin: 4px 0; }
  .swipe-hint { text-align: center; font-size: 11px; color: var(--muted); padding: 8px 0; border-top: 1px solid var(--borde); margin-top: 8px; }
  .bottom-nav { height: 60px; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid var(--borde); background: var(--tarjeta); }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; color: var(--muted); }
  .nav-item.on { color: var(--acento); }
  .nav-item .ic { font-size: 16px; }
  .design-label { text-align: center; padding: 10px; font-family: Georgia, serif; font-size: 14px; color: var(--subrayado); background: var(--fondo); border-top: 1px solid var(--borde); }
</style>
</head>
<body data-theme="claro">
<div class="wrap">
  <div class="phone-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="app-bar"><span class="title">VeD Cancionero</span><div class="icons"><span>🔍</span></div></div>
  <div class="screen">
    <div class="song-area">
      <div class="lyrics">
        <div class="ln"><span class="p"><span class="c">Re</span><span class="t">Bendeciré al </span></span><span class="p"><span class="c">Sol</span><span class="t">Señor, </span></span></div>
        <div class="ln"><span class="p"><span class="c">Re</span><span class="t">en todo </span></span><span class="p"><span class="c">La</span><span class="t">tiempo.</span></span></div>
        <div class="chorus">
          <div class="ln"><span class="p"><span class="c">Do</span><span class="t">Gloria, </span></span><span class="p"><span class="c">Re</span><span class="t">gloria </span></span><span class="p"><span class="c">Mi</span><span class="t">a Dios.</span></span></div>
        </div>
      </div>
    </div>
    <div class="song-meta">
      <span class="title">Bendeciré al Señor</span><span>·</span><span>Re</span><span>·</span><span>Zamba</span>
    </div>
    <div class="voice">Voz: [Varón bajo ▼]</div>
    <div class="transpose">
      <div class="tp-btn">−</div>
      <div class="tp-key"><div class="k">Sol</div><div class="u">Original Mi</div></div>
      <div class="tp-btn">+</div>
      <div class="tp-cap"><div class="v">2</div><div class="u">Cejilla</div></div>
    </div>
    <div class="tools">
      <span class="tool on">DoM/C+</span><span class="tool">Ocultar</span><span class="tool">🖨</span><span class="tool">A−</span><span class="tool">A+</span>
    </div>
    <div class="swipe-hint">← Deslizá para ver la lista →</div>
  </div>
  <div class="bottom-nav">
    <div class="nav-item on"><span class="ic">🎵</span><span>Canción</span></div>
    <div class="nav-item"><span class="ic">📋</span><span>Listas</span></div>
  </div>
  <div class="design-label">D1 — Canción principal (pantalla de inicio)</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('ved_theme')||'claro';
    document.body.setAttribute('data-theme', saved);
  });
</script>
</body>
</html>
