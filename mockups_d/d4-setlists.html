<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D4 — Setlists</title>
<link rel="stylesheet" href="../estilos.css">
<style>
  .wrap { max-width: 420px; margin: 0 auto; background: var(--tarjeta); border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.2); border: 1px solid var(--borde); }
  .phone-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--borde); }
  .app-bar { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--borde); }
  .app-bar .back { font-size: 16px; color: var(--muted); }
  .app-bar .title { font-family: Georgia, serif; font-size: 16px; color: var(--subrayado); }
  .app-bar .btn { height: 28px; padding: 0 10px; border-radius: 6px; border: none; font-size: 10px; font-weight: 600; background: var(--subrayado); color: #FBEFDF; }
  .screen { padding: 14px 16px; }
  .list-card { background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; padding: 10px; margin-bottom: 6px; }
  .list-card .title { font-family: Georgia, serif; font-size: 13px; color: var(--subrayado); margin-bottom: 2px; }
  .list-card .meta { font-size: 10px; color: var(--muted); }
  .bottom-nav { height: 60px; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid var(--borde); background: var(--tarjeta); }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; color: var(--muted); }
  .nav-item.on { color: var(--acento); }
  .nav-item .ic { font-size: 16px; }
  .design-label { text-align: center; padding: 10px; font-family: Georgia, serif; font-size: 14px; color: var(--subrayado); background: var(--fondo); border-top: 1px solid var(--borde); }
</style>
</head>
<body data-theme="claro">
<div class="wrap">
  <div class="phone-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="app-bar"><span class="back">←</span><span class="title">Listas de canciones</span><span class="btn">+ Nueva</span></div>
  <div class="screen">
    <div class="list-card"><div class="title">Misa del domingo</div><div class="meta">12 canciones · 35 min</div></div>
    <div class="list-card"><div class="title">Misa carismática</div><div class="meta">8 canciones · 25 min</div></div>
    <div class="list-card"><div class="title">Retiro de Adviento</div><div class="meta">15 canciones · 45 min</div></div>
  </div>
  <div class="bottom-nav">
    <div class="nav-item on"><span class="ic">🎵</span><span>Canción</span></div>
    <div class="nav-item"><span class="ic">📋</span><span>Listas</span></div>
  </div>
  <div class="design-label">D4 — Setlists (accesible desde menú)</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('ved_theme')||'claro';
    document.body.setAttribute('data-theme', saved);
  });
</script>
</body>
</html>
